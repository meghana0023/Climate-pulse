<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Pulse | Dashboard</title>
    <style>
        :root { --bg: #0f172a; --panel: #ffffff; --accent: #0284c7; --text: #1e293b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; margin: 0; }
        nav { background: rgba(0,0,0,0.4); padding: 1rem 5%; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .main-wrapper { display: flex; justify-content: center; gap: 40px; padding: 60px 20px; flex-wrap: wrap; }
        .card { background: var(--panel); color: var(--text); padding: 40px; border-radius: 24px; width: 400px; height: 520px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .output-panel { visibility: hidden; opacity: 0; transition: 0.5s; border-top: 8px solid var(--accent); }
        .output-panel.visible { visibility: visible; opacity: 1; }
        h2 { font-size: 1rem; text-transform: uppercase; color: #64748b; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        input, select { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc; box-sizing: border-box; }
        .btn-analyze { background: var(--text); color: white; padding: 16px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; margin-top: auto; }
        .metric { text-align: center; margin: auto 0; }
        .m-val { font-size: 3rem; font-weight: 900; }
        .status-badge { background: var(--text); color: white; padding: 20px; border-radius: 15px; text-align: center; font-weight: 800; margin-top: auto; }
    </style>
</head>
<body>
    <nav><strong>🌧 CLIMATE PULSE</strong></nav>
    <div class="main-wrapper">
        <div class="card">
            <h2>Input Parameters</h2>
            <select id="state">
                <option value="" disabled selected>Select State...</option>
                {% for s in states %}<option value="{{s}}">{{s}}</option>{% endfor %}
            </select>
            <input type="number" id="year" placeholder="Year (YYYY)">
            <input type="number" id="month" placeholder="Month (1-12)">
            <button class="btn-analyze" id="run-btn" onclick="runPrediction()">Run Analysis</button>
            <p id="loader" style="display:none; color: #0284c7; text-align: center;">⚙ Processing...</p>
        </div>

        <div class="card output-panel" id="out-panel">
            <h2>Prediction Report</h2>
            <div class="metric">
                <small>PREDICTED RAINFALL</small>
                <div class="m-val"><span id="res-rain">0.0</span><small>mm</small></div>
            </div>
            <div class="metric">
                <small>SPI-3 INDEX</small>
                <div class="m-val" id="res-spi">0.0</div>
            </div>
            <div class="status-badge" id="res-status">--</div>
        </div>
    </div>

    <script>
        async function runPrediction() {
            const btn = document.getElementById('run-btn');
            const data = {
                state: document.getElementById('state').value,
                year: document.getElementById('year').value,
                month: document.getElementById('month').value
            };

            btn.disabled = true;
            document.getElementById('loader').style.display = 'block';

            try {
                const response = await fetch("/api/predict", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "X-API-KEY": "meghana_secret_2025" // MUST match .env
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error);

                document.getElementById('res-rain').innerText = result.rainfall;
                document.getElementById('res-spi').innerText = result.spi;
                document.getElementById('res-status').innerText = result.status;
                document.getElementById('out-panel').classList.add('visible');
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
